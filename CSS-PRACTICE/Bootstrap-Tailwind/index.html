<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="d-flex justify-content-center gap-5 align-items-center vh-100">
        <!-- CSS -->

        <div id="css-card">
            <img src="image.png" alt="Profile-img">
            <h2 class="name">Jhon Doe</h2>
            <p class="job">Frontend Developer</p>
            <button>View Profile</button>
        </div>

        <!-- Bootstrap -->

        <div class="card shadow" style="width:300px; height:350px;">
            <div class="card-body d-flex flex-column justify-content-center align-items-center p-4">

                <img src="image.png" class="rounded-circle mb-3" width="75" height="75">

                <h2 class="card-title mb-2">John Doe</h2>

                <p class="card-text text-secondary mb-4">
                    Frontend Developer
                </p>

                <button class="btn btn-primary w-4/5">
                    View Profile
                </button>

            </div>
        </div>

        <!-- Tailwind -->

        <div class="w-[300px] h-[350px] bg-white rounded-xl shadow-lg
            flex flex-col justify-center items-center p-6">

            <img src="image.png" class="w-20 h-20 mb-3 rounded-full">

            <h2 class="text-3xl font-semibold">
                John Doe
            </h2>

            <p class="text-gray-500 mb-4">
                Frontend Developer
            </p>

            <button class="w-4/5 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                View Profile
            </button>

        </div>
    </div>
</body>

</html>
